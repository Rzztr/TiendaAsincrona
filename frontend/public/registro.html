<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div class="container">
        <h1>Registro de tienda</h1>
        <form action="/register" method="POST">
            <input type="text" name="username" placeholder="Usuario" required><br>
            <input type="text" name="phone" placeholder="Telefono" required><br>
            <input type="email" name="email" placeholder="Correo" required><br>
            <input type="password" name="password" placeholder="Contraseña" required><br>
            <button type="submit">Registrarse</button>
        </form>
        <p><a href="/login">Inicia sesion si ya tienes una cuenta</a></p>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);

        if (params.get("error") === "duplicado"){
            alert("ya hay una cuenta con estas credenciales")
        }
    </script>
</body>
</html>
