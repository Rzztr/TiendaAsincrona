<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>recuperar contraseña</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div class="container">
        <h2>Recuperacion de contraseñas</h2>
        <form id="recovery-form">
            <input type="text" id="username" placeholder="usuario o email" required><br>

            <h3>Selecciona metodo:</h3>
            <input type="radio" name="method" value="email" checked>Envio por correo<br>
            <input type="radio" name="method" value="sms">SMS al telefono<br>
            <input type="radio" name="method" value="call">llamada telefonica<br>

            <button type="submit">Recuperar</button>
        </form>
        <div id="otp-section" style="display: none;">
            <h3>Ingresa codigo OTP</h3>
            <input type="text" id="otp-code" placeholder="Codigo OTP"><br>
            <input type="password" id="new-password" placeholder="Nueva contraseña"><br>
            <button onclick="resetPassword()">Cambiar de contraseña</button>
            <script src="./js/app.js" ></script>
        </div>
    </div>
</body>
</html>
